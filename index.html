<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="apple-touch-icon" href="/vite.svg" />
  <link rel="manifest" href="/manifest.json?v=4" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polomolok Disaster Alert System</title>
  <!-- Leaflet Map CSS (Reliable CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <!-- Leaflet Map JS (Reliable CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <style>
    .leaflet-container {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased app-loading">

  <!-- PWA Splash Screen -->
  <div id="splash-screen" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    ">
    <!-- App Icon -->
    <img src="/vite.svg" alt="Logo" style="
        width: 100px;
        height: 100px;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(2, 132, 199, 0.4);
      " />

    <!-- App Name -->
    <div style="text-align: center;">
      <p style="
          color: white;
          font-size: 22px;
          font-weight: 900;
          font-family: Inter, Arial, sans-serif;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin: 0 0 6px 0;
        ">Polomolok</p>
      <p style="
          color: #38bdf8;
          font-size: 11px;
          font-weight: 700;
          font-family: Inter, Arial, sans-serif;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          margin: 0;
        ">MDRRMO Disaster Alert App</p>
    </div>

    <!-- Dual Ring Spinner -->
    <div style="position: relative; width: 56px; height: 56px;">
      <!-- Outer ring: clockwise -->
      <div style="
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 3px solid rgba(255,255,255,0.08);
        "></div>
      <div style="
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 3px solid transparent;
          border-top-color: #0284c7;
          border-right-color: #38bdf8;
          animation: spin-cw 0.9s linear infinite;
        "></div>
      <!-- Inner ring: counterclockwise -->
      <div style="
          position: absolute;
          inset: 10px;
          border-radius: 50%;
          border: 3px solid rgba(255,255,255,0.08);
        "></div>
      <div style="
          position: absolute;
          inset: 10px;
          border-radius: 50%;
          border: 3px solid transparent;
          border-bottom-color: #38bdf8;
          border-left-color: #7dd3fc;
          animation: spin-ccw 0.7s linear infinite;
        "></div>
    </div>
  </div>

  <style>
    @keyframes spin-cw {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spin-ccw {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes app-entry {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-loading #root {
      opacity: 0;
    }

    .app-ready #root {
      animation: app-entry 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .splash-exit {
      opacity: 0 !important;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .splash-exit {
        transform: scale(1.1);
      }
    }
  </style>

  <div id="root"></div>

  <script>
    // Show splash for minimum 3 seconds, then hide once React mounts
    const splash = document.getElementById('splash-screen');
    const root = document.getElementById('root');
    const MIN_DISPLAY = 3000;
    const startTime = Date.now();

    function hideSplash() {
      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, MIN_DISPLAY - elapsed);
      setTimeout(() => {
        // Trigger exit/entry animations
        splash.classList.add('splash-exit');
        document.body.classList.remove('app-loading');
        document.body.classList.add('app-ready');

        setTimeout(() => splash.remove(), 800);
      }, remaining);
    }

    const observer = new MutationObserver(() => {
      if (root.children.length > 0) {
        observer.disconnect();
        hideSplash();
      }
    });
    observer.observe(root, { childList: true });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          (reg) => {
            console.log('ServiceWorker registration successful');

            // Check for updates every time the app is opened
            reg.update();

            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content is available; force reload to apply
                  window.location.reload();
                }
              };
            };
          }
        );
      });

      // Reload when the new service worker takes control
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          window.location.reload();
          refreshing = true;
        }
      });
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
