<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rain-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#607D8B"/>
      <stop offset="100%" stop-color="#455A64"/>
    </linearGradient>
    <linearGradient id="quake-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <linearGradient id="typhoon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0277BD"/>
    </linearGradient>
    <linearGradient id="flood-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <clipPath id="tl"><rect x="24" y="24" width="218" height="218" rx="32"/></clipPath>
    <clipPath id="tr"><rect x="270" y="24" width="218" height="218" rx="32"/></clipPath>
    <clipPath id="bl"><rect x="24" y="270" width="218" height="218" rx="32"/></clipPath>
    <clipPath id="br"><rect x="270" y="270" width="218" height="218" rx="32"/></clipPath>
  </defs>

  <!-- White rounded background with padding -->
  <rect width="512" height="512" rx="80" fill="#0f172a"/>

  <!-- ===== TOP-LEFT: RAIN ===== -->
  <g clip-path="url(#tl)">
    <rect x="24" y="24" width="218" height="218" rx="32" fill="url(#rain-bg)"/>
    <!-- Cloud -->
    <ellipse cx="133" cy="98" rx="48" ry="26" fill="#B0BEC5"/>
    <ellipse cx="108" cy="107" rx="34" ry="22" fill="#CFD8DC"/>
    <ellipse cx="158" cy="107" rx="34" ry="22" fill="#CFD8DC"/>
    <ellipse cx="133" cy="111" rx="48" ry="24" fill="#ECEFF1"/>
    <!-- Rain drops -->
    <line x1="90"  y1="142" x2="83"  y2="168" stroke="#90CAF9" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="146" x2="105" y2="172" stroke="#90CAF9" stroke-width="4" stroke-linecap="round"/>
    <line x1="133" y1="142" x2="126" y2="168" stroke="#90CAF9" stroke-width="4" stroke-linecap="round"/>
    <line x1="155" y1="146" x2="148" y2="172" stroke="#90CAF9" stroke-width="4" stroke-linecap="round"/>
    <line x1="175" y1="142" x2="168" y2="168" stroke="#90CAF9" stroke-width="4" stroke-linecap="round"/>
    <line x1="96"  y1="175" x2="89"  y2="201" stroke="#64B5F6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="120" y1="178" x2="113" y2="204" stroke="#64B5F6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="144" y1="175" x2="137" y2="201" stroke="#64B5F6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="166" y1="178" x2="159" y2="204" stroke="#64B5F6" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ===== TOP-RIGHT: TYPHOON ===== -->
  <g clip-path="url(#tr)">
    <rect x="270" y="24" width="218" height="218" rx="32" fill="url(#typhoon-bg)"/>
    <!-- Typhoon swirl -->
    <path d="M379 133 Q426 86 426 133 Q426 180 379 180 Q332 180 332 133 Q332 99 365 90" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
    <path d="M379 113 Q408 86 408 113 Q408 140 379 149 Q350 158 340 133 Q333 111 356 102" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <circle cx="379" cy="133" r="11" fill="white"/>
    <!-- Palm tree -->
    <rect x="346" y="178" width="5" height="44" fill="#795548" transform="rotate(-8 349 222)"/>
    <path d="M326 176 Q342 164 354 178" fill="#66BB6A"/>
    <path d="M333 168 Q346 158 355 171" fill="#81C784"/>
    <path d="M320 172 Q338 165 346 180" fill="#4CAF50"/>
  </g>

  <!-- ===== BOTTOM-LEFT: EARTHQUAKE ===== -->
  <g clip-path="url(#bl)">
    <rect x="24" y="270" width="218" height="218" rx="32" fill="url(#quake-bg)"/>
    <!-- Ground -->
    <rect x="24" y="380" width="218" height="108" fill="#4E342E"/>
    <!-- Crack -->
    <path d="M133 380 L125 398 L140 407 L127 435 L134 460" fill="none" stroke="#1A0000" stroke-width="5" stroke-linecap="round"/>
    <!-- Buildings -->
    <rect x="50"  y="322" width="40" height="76" fill="#EF9A9A" transform="rotate(-6 70 380)"/>
    <rect x="63"  y="308" width="20" height="22" fill="#E57373" transform="rotate(-6 73 319)"/>
    <rect x="156" y="318" width="38" height="80" fill="#EF9A9A" transform="rotate(7 175 380)"/>
    <rect x="168" y="306" width="16" height="22" fill="#E57373" transform="rotate(7 176 317)"/>
    <!-- Windows -->
    <rect x="56"  y="332" width="9" height="9" fill="#FFEE58" rx="1" transform="rotate(-6 61 337)"/>
    <rect x="72"  y="332" width="9" height="9" fill="#FFEE58" rx="1" transform="rotate(-6 77 337)"/>
    <rect x="162" y="328" width="9" height="9" fill="#FFEE58" rx="1" transform="rotate(7 167 333)"/>
  </g>

  <!-- ===== BOTTOM-RIGHT: FLOOD ===== -->
  <g clip-path="url(#br)">
    <rect x="270" y="270" width="218" height="218" rx="32" fill="url(#flood-bg)"/>
    <!-- Sky -->
    <rect x="270" y="270" width="218" height="105" fill="#1976D2"/>
    <!-- Dark clouds -->
    <ellipse cx="355" cy="304" rx="38" ry="20" fill="#455A64" opacity="0.85"/>
    <ellipse cx="340" cy="311" rx="26" ry="16" fill="#546E7A" opacity="0.8"/>
    <ellipse cx="378" cy="311" rx="28" ry="16" fill="#546E7A" opacity="0.8"/>
    <!-- House -->
    <rect x="316" y="346" width="86" height="54" fill="#F5F5F5"/>
    <polygon points="309,346 359,311 409,346" fill="#BDBDBD"/>
    <!-- Windows -->
    <rect x="324" y="357" width="19" height="17" fill="#90CAF9" rx="2"/>
    <rect x="375" y="357" width="19" height="17" fill="#90CAF9" rx="2"/>
    <!-- Door -->
    <rect x="349" y="370" width="20" height="29" fill="#8D6E63" rx="2"/>
    <!-- Water -->
    <rect x="270" y="388" width="218" height="100" fill="#1565C0"/>
    <path d="M270 393 Q298 381 326 393 Q354 405 382 393 Q410 381 438 393 Q466 405 488 393" fill="none" stroke="#90CAF9" stroke-width="5" stroke-linecap="round"/>
    <path d="M270 410 Q298 398 326 410 Q354 422 382 410 Q410 398 438 410 Q466 422 488 410" fill="none" stroke="#BBDEFB" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Divider cross -->
  <rect x="246" y="24"  width="20" height="464" fill="#0f172a" rx="10"/>
  <rect x="24"  y="246" width="464" height="20"  fill="#0f172a" rx="10"/>
</svg>
